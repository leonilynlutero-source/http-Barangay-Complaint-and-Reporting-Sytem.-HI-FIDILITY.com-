<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complaint</title>
<link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="report" data-role="user">
<main>
  <section id="formView">
    <header class="head">
      <div>
        <h1>Incident Report</h1>
        <p class="sub">Tell us what went wrong. Fields marked * are required.</p>
      </div>
      <a class="back" href="home.html">&larr; Back to home</a>
    </header>

    <form id="f" novalidate onsubmit="return submitReport()">
      <div class="rgrid">

        <label class="f span-all">Type of Incident *
          <select id="type">
            <option value="">Select a type</option>
            <option>Fire</option>
            <option>Medical emergency</option>
            <option>Theft</option>
            <option>Physical Injury</option>
            <option>Property Damage</option>
            <option>Other</option>
          </select>
        </label>

        <label class="f span-all">Subject *
          <input type="text" id="subject" maxlength="120" placeholder="A short title for your complaint" autocomplete="off">
        </label>

        <label class="f span-all">Location *
          <input type="text" id="location" placeholder="Street, building, or landmark" autocomplete="off">
        </label>

        <label class="f">Date *
          <input type="date" id="date">
        </label>

        <label class="f">Time *
          <input type="time" id="time">
        </label>

        <label class="f span-all">Description *
          <textarea id="desc" rows="5" maxlength="500" placeholder="Describe the problem, who was involved, and anything else that may help."></textarea>
          <span class="count"><span id="n">0</span>/500</span>
        </label>

        <div class="f span-all">
          <span class="lbl">Photo (optional)</span>
          <input type="file" id="photo" accept="image/*" class="file-input">
          <label for="photo" class="pick" id="pick">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4V8z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <span id="pickText">Tap to add a photo</span>
          </label>
          <div class="preview" id="preview" hidden>
            <img id="img" alt="Selected photo preview">
            <button type="button" class="ghost" id="remove">Remove photo</button>
          </div>
        </div>

        <p class="err span-all" id="err" role="alert"></p>

        <div class="actions span-all">
          <button class="go" type="submit">Submit incident report</button>
        </div>
      </div>
    </form>
  </section>

  <section id="doneView" hidden>
    <h1>Incident report submitted</h1>
    <p class="sub">Thank you. Your incident report was received.</p>
    <p class="refbox">Reference number <b id="ref"></b></p>
    <p class="note" id="doneNote">Keep this number to follow the progress of your incident report.</p>
    <div class="actions">
      <a class="ghost" id="trackLink" href="track-status.html">Track status</a>
      <button class="go" type="button" onclick="window.location.href='home.html'">Back to home</button>
    </div>
  </section>
</main>

<script>
  var $ = function (id) { return document.getElementById(id); };

  // Complaints are saved here. Incident reports use a different key ("incidentReports").
  var KEY = "complaintReports";

  var photoName = "";
  var photoData = "";      // the resized photo, saved with the report
  var processing = false;  // true while the photo is being resized

  // Default the date and time to now, and don't allow future dates
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function setNow() {
    var d = new Date();
    $("date").value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    $("date").max = $("date").value;
    $("time").value = pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  // Description counter
  $("desc").addEventListener("input", function () { $("n").textContent = this.value.length; });

  // Photo preview
  $("photo").addEventListener("change", function () {
    var file = this.files[0];
    $("err").textContent = "";
    if (!file) { clearPhoto(); return; }
    if (file.type.indexOf("image/") !== 0) {
      $("err").textContent = "Please choose an image file.";
      clearPhoto();
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      $("err").textContent = "The photo is too large. Choose one under 5 MB.";
      clearPhoto();
      return;
    }
    photoName = file.name;
    processing = true;
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        // Shrink to at most 1280px wide or tall so it fits in storage
        var max = 1280;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        photoData = canvas.toDataURL("image/jpeg", 0.75);
        $("img").src = photoData;
        $("preview").hidden = false;
        $("pick").hidden = true;
        processing = false;
      };
      img.onerror = function () {
        $("err").textContent = "That photo could not be read. Try a different one.";
        clearPhoto();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  function clearPhoto() {
    $("photo").value = "";
    $("img").removeAttribute("src");
    $("preview").hidden = true;
    $("pick").hidden = false;
    photoName = "";
    photoData = "";
    processing = false;
  }
  $("remove").addEventListener("click", clearPhoto);

  function submitReport() {
    var type = $("type").value;
    var subject = $("subject").value.trim();
    var loc = $("location").value.trim();
    var date = $("date").value;
    var time = $("time").value;
    var desc = $("desc").value.trim();

    if (type === "" || subject === "" || loc === "" || date === "" || time === "" || desc === "") {
      $("err").textContent = "Fill in every required field.";
      return false;
    }
    if (new Date(date + "T" + time) > new Date()) {
      $("err").textContent = "The date and time cannot be in the future.";
      return false;
    }
    if (desc.length < 10) {
      $("err").textContent = "Add a little more detail to the description.";
      return false;
    }

    if (processing) {
      $("err").textContent = "Please wait a moment while the photo finishes loading.";
      return false;
    }

    var ref = "CMP-" + Date.now().toString(36).toUpperCase();
    var report = {
      ref: ref, type: type, subject: subject, location: loc, date: date, time: time,
      description: desc, photo: photoName, photoData: photoData, status: "Pending",
      submitted: new Date().toISOString()
    };

    // Demo: keep the complaint in this browser. Replace with a request to your server.
    function saveReport(r) {
      try {
        var all = JSON.parse(localStorage.getItem(KEY) || "[]");
        if (!Array.isArray(all)) all = [];
        all.push(r);
        localStorage.setItem(KEY, JSON.stringify(all));
        return true;
      } catch (e) { return false; }
    }

    var note = "Keep this number to follow the progress of your complaint.";
    if (saveReport(report)) {
      if (report.photoData) {
        note = "Your photo was attached (" + Math.round(report.photoData.length / 1024) + " KB). " + note;
      } else if (report.photo) {
        note = "Your complaint was saved, but the photo was not attached. " + note;
      }
    } else if (report.photoData) {
      // Storage is full: save the complaint without the picture and say so
      report.photoData = "";
      if (saveReport(report)) {
        note = "Your complaint was saved, but the photo was too large to keep. " + note;
      }
    }
    $("doneNote").textContent = note;

    $("err").textContent = "";
    $("ref").textContent = ref;
    $("trackLink").href = "track-status.html?ref=" + encodeURIComponent(ref);
    $("formView").hidden = true;
    $("doneView").hidden = false;
    window.scrollTo(0, 0);
    return false;
  }

  setNow();
</script>
</body>
</html>
